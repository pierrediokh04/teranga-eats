<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <a href="menu.html" class="btn big">See the menu</a>

    <span class="logo">Teranga <span>Eats</span></span>
