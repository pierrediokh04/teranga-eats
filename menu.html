<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — Teranga Eats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">Teranga <span>Eats</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html" class="active">Menu</a>
    </nav>
    <a href="cart.html" class="cart-link">Cart <span id="cart-count">0</span></a>
  </header>

  <main>
    <h1>Our menu</h1>

    <div class="toolbar">
      <div class="filters">
        <button class="filter active" data-category="all">All</button>
        <button class="filter" data-category="starters">Starters</button>
        <button class="filter" data-category="mains">Mains</button>
        <button class="filter" data-category="drinks">Drinks</button>
        <button class="filter" data-category="desserts">Desserts</button>
      </div>
      <input type="search" id="search" placeholder="Search a dish">
      <select id="sort">
        <option value="default">Sort by</option>
        <option value="low">Price: low → high</option>
        <option value="high">Price: high → low</option>
      </select>
    </div>

    <p id="no-result" class="hidden">No dish matches your search.</p>
    <section id="menu-grid" class="grid"></section>
  </main>

  <footer>
    <span class="logo">Teranga <span>Eats</span></span>
    <p>Dakar · 77 000 00 00 · Open 12h–23h</p>
  </footer>

  <script type="module" src="js/menu.js"></script>
</body>
</html>
